<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>扫码挪车 - 隐私说明</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./index.html">扫码挪车</a>
      <nav>
        <a href="./index.html">生成二维码</a>
        <a href="./setup.html">使用说明</a>
      </nav>
    </header>

    <main class="shell">
      <section class="panel intro">
        <p class="eyebrow">隐私说明</p>
        <h1>静态免费版的隐私边界</h1>
        <p>这个版本不依赖服务器，因此不会把你的联系方式上传到后台。但二维码本身包含联系配置，所以不适合放入高度敏感信息。</p>
      </section>

      <section class="panel">
        <h2>这个版本会做什么</h2>
        <ul class="checklist">
          <li>在浏览器本地生成访客链接。</li>
          <li>在访客页显示脱敏车牌。</li>
          <li>提供拨号、短信和复制联系文案按钮。</li>
        </ul>
      </section>

      <section class="panel">
        <h2>这个版本做不到什么</h2>
        <ul class="checklist">
          <li>做不到服务端匿名中转通知。</li>
          <li>做不到真正隐藏所有联系信息。</li>
          <li>做不到远程修改或撤销已经印出的二维码。</li>
          <li>做不到通知日志、限流和后台管理。</li>
        </ul>
      </section>
    </main>
  </body>
</html>
