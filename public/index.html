<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>扫码挪车 - 免费静态版</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="bind">
    <header class="topbar">
      <a class="brand" href="./index.html">扫码挪车</a>
      <nav>
        <a href="./index.html">生成二维码</a>
        <a href="./demo.html">流程演示</a>
        <a href="./setup.html">使用说明</a>
        <a href="./privacy.html">隐私说明</a>
      </nav>
    </header>

    <main class="shell">
      <section class="panel intro">
        <p class="eyebrow">完全免费 · 纯静态 · 国内可访问</p>
        <h1>本地生成扫码挪车二维码</h1>
        <p>这个版本不依赖后端。车主在浏览器里填写车牌和联系方式后，页面直接生成访客扫码链接与二维码。</p>
      </section>

      <section class="panel">
        <h2>1. 本地预览车牌照片</h2>
        <form id="ocrForm" class="stack">
          <label>
            车牌照片
            <input id="plateImage" name="plateImage" type="file" accept="image/*" />
          </label>
          <button type="submit">预览并继续手动确认</button>
        </form>
        <div id="ocrResult" class="result hidden"></div>
      </section>

      <section class="panel">
        <h2>2. 生成联系二维码</h2>
        <form id="bindForm" class="grid-form">
          <label>
            车牌号
            <input id="plateNumber" name="plateNumber" placeholder="例如 粤A12345" required />
          </label>
          <label>
            车主手机号
            <input id="ownerPhone" name="ownerPhone" inputmode="tel" placeholder="用于拨号或短信" />
          </label>
          <label>
            车主微信号
            <input id="wechatId" name="wechatId" placeholder="可选，用于复制联系" />
          </label>
          <label>
            自定义联系链接
            <input id="customLink" name="customLink" placeholder="可选，例如企业微信客服链接" />
          </label>
          <label class="span-2">
            提醒文案
            <textarea id="smsText" name="smsText" rows="4" placeholder="留空则使用默认提醒文案"></textarea>
          </label>
          <label class="span-2">
            备注
            <textarea id="note" name="note" rows="3" placeholder="例如：请说明车辆所在位置"></textarea>
          </label>
          <button type="submit">生成二维码和访客链接</button>
        </form>
        <p class="form-note">提醒：静态免费版不会把信息发到服务器，但二维码中的联系配置不适合保存高度敏感信息。</p>
        <div id="bindResult" class="result hidden"></div>
      </section>
    </main>

    <script src="./config.js"></script>
    <script src="./app.js" type="module"></script>
  </body>
</html>
