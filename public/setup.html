<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>扫码挪车 - 使用说明</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="setup">
    <header class="topbar">
      <a class="brand" href="./index.html">扫码挪车</a>
      <nav>
        <a href="./index.html">生成二维码</a>
        <a href="./demo.html">流程演示</a>
        <a href="./privacy.html">隐私说明</a>
      </nav>
    </header>

    <main class="shell">
      <section class="panel intro">
        <p class="eyebrow">使用说明</p>
        <h1>完全免费静态版怎么用</h1>
        <p>这个版本只需要静态网页托管，不需要数据库、云函数或短信服务。</p>
      </section>

      <section class="panel">
        <h2>当前状态</h2>
        <div id="setupStatus" class="result">正在读取说明...</div>
        <form id="setupCheckForm" class="stack">
          <button type="submit">查看静态版检查项</button>
        </form>
        <div id="healthResult" class="result hidden"></div>
      </section>

      <section class="panel">
        <h2>最简单的使用步骤</h2>
        <ul class="checklist">
          <li>打开首页，填写车牌和联系方式。</li>
          <li>生成二维码并打印挪车卡片。</li>
          <li>访客扫码后，通过电话、短信或复制文案联系车主。</li>
          <li>需要更新联系方式时，回首页重新生成二维码。</li>
        </ul>
      </section>
    </main>

    <script src="./config.js"></script>
    <script src="./app.js" type="module"></script>
  </body>
</html>
